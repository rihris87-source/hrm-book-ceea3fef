<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Book — Option Pricing Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101A26; --ink-2:#3A4A5C; --ink-3:#6B7C8E;
  --paper:#FFFFFF; --field:#EDF1F5; --field-2:#F6F8FA;
  --rule:#D3DAE1; --rule-2:#E4E9EE;
  --blue:#1B5E9E; --blue-soft:#E3EDF7;
  --green:#0D7A57; --green-soft:#E0F2EA;
  --amber:#8A5200; --amber-soft:#F7EEDF;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--field-2);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- masthead ---------- */
.masthead{
  position:sticky; top:0; z-index:40; background:var(--ink); color:#fff;
  border-bottom:3px solid var(--blue);
}
.loctabsrow{padding:10px 20px 0; display:flex}
.loctabs{display:flex; gap:4px}
.loctab{
  font-family:var(--cond); font-weight:700; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
  background:#16212D; color:#7E93A8; border:1px solid #2C3D50; border-bottom:none;
  border-radius:4px 4px 0 0; padding:8px 20px 7px;
}
.loctab:hover{background:#1E2C3B; color:#D5E1EC}
.loctab[aria-pressed="true"]{background:var(--field-2); color:var(--ink); border-color:var(--field-2)}
.mast-top{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:10px 20px 0;
}
.wordmark{font-family:var(--cond); font-weight:700; font-size:19px; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
.wordmark span{color:#8FB6DA; font-weight:500}
.mast-meta{font-family:var(--mono); font-size:11px; color:#8296AA; letter-spacing:.04em; margin-left:auto}

/* model lock */
.modelbar{padding:8px 20px 12px}
.modelbar-label{
  font-family:var(--cond); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:#8FB6DA; margin-bottom:6px;
}
.chips{display:flex; gap:5px; flex-wrap:wrap}
.chip{
  font-family:var(--cond); font-size:13px; font-weight:600; letter-spacing:.01em;
  background:#1E2C3B; color:#B9C8D6; border:1px solid #2C3D50;
  padding:5px 11px; border-radius:2px; transition:background .12s,color .12s;
}
.chip:hover{background:#26374A; color:#fff}
.chip[aria-pressed="true"]{background:#fff; color:var(--ink); border-color:#fff}

/* markup + view controls */
.ctrls{display:flex; align-items:center; gap:10px; margin-left:auto; flex-wrap:wrap}
.ctrl{
  display:flex; align-items:center; gap:8px; background:#1E2C3B; border:1px solid #2C3D50;
  border-radius:3px; padding:4px 8px 4px 10px;
}
.ctrl-l{font-family:var(--cond); font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:#8FB6DA}
.switch{
  position:relative; width:34px; height:18px; border-radius:9px; background:#3A4E63;
  border:0; padding:0; flex:none; transition:background .15s;
}
.switch::after{
  content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
  background:#fff; transition:transform .15s;
}
.switch[aria-checked="true"]{background:#4E9BE0}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.pctwrap{display:flex; align-items:baseline; gap:1px; color:#fff; font-family:var(--mono); font-size:14px}
#pct{
  width:34px; background:transparent; border:0; border-bottom:1px solid #3A4E63; color:#fff;
  font-family:var(--mono); font-size:14px; font-weight:600; text-align:right; padding:0 1px 1px;
  outline:0; -moz-appearance:textfield;
}
#pct:focus{border-bottom-color:#4E9BE0}
#pct::-webkit-outer-spin-button,#pct::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctrl.off .pctwrap,.ctrl.off #pct{opacity:.4}
/* search */
.searchwrap{padding:0 20px 14px; position:relative}
.searchbox{display:flex; align-items:center; background:#fff; border-radius:3px; overflow:hidden}
.searchbox svg{margin-left:12px; flex:none; color:var(--ink-3)}
#q{
  flex:1; border:0; outline:0; padding:13px 12px; font-size:17px; font-family:var(--sans);
  background:transparent; min-width:0;
}
#q::placeholder{color:#9AA9B8}
.kbd{
  font-family:var(--mono); font-size:11px; color:var(--ink-3); border:1px solid var(--rule);
  border-radius:3px; padding:2px 6px; margin-right:10px; flex:none;
}
.clearbtn{border:0;background:transparent;color:var(--ink-3);padding:0 12px;font-size:20px;line-height:1;display:none}
.clearbtn.on{display:block}

/* ---------- layout ---------- */
.shell{display:grid; grid-template-columns:236px 1fr; gap:0; max-width:1440px; margin:0 auto; align-items:start}
.rail{
  position:sticky; top:186px; align-self:start; padding:20px 12px 40px;
  max-height:calc(100vh - 186px); overflow-y:auto;
}
.rail-h{
  font-family:var(--cond); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); padding:0 8px; margin:0 0 8px;
}
.rail-h + .rail-h{margin-top:22px}
.navitem{
  display:flex; align-items:baseline; gap:8px; width:100%; text-align:left;
  border:0; background:transparent; padding:5px 8px; border-radius:3px;
  font-size:14px; color:var(--ink-2); line-height:1.3;
}
.navitem:hover{background:#E7ECF1; color:var(--ink)}
.navitem[aria-current="true"]{background:var(--ink); color:#fff}
.navitem[aria-current="true"] .nav-n{color:#9FBEDC}
.navitem[aria-current="true"] .nav-c{color:#9FBEDC}
.nav-n{font-family:var(--mono); font-size:11px; color:var(--ink-3); flex:none; width:22px}
.nav-t{flex:1}
.nav-c{font-family:var(--mono); font-size:11px; color:var(--ink-3); flex:none}
.navitem.dim{opacity:.35}

.main{padding:20px 24px 140px; min-width:0}

/* ---------- results ---------- */
.statusline{
  font-family:var(--mono); font-size:12px; color:var(--ink-3); margin:0 0 16px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.statusline b{color:var(--ink); font-weight:600}
.pill{
  background:var(--blue-soft); color:var(--blue); border-radius:2px; padding:2px 7px;
  font-family:var(--cond); font-weight:600; font-size:12px; letter-spacing:.02em;
}

.sect{background:var(--paper); border:1px solid var(--rule); border-radius:3px; margin-bottom:14px; overflow:hidden}
.sect-h{
  display:flex; align-items:baseline; gap:10px; padding:11px 16px;
  background:var(--ink); color:#fff;
}
.sect-code{font-family:var(--mono); font-size:12px; color:#8FB6DA; font-weight:500}
.sect-name{font-family:var(--cond); font-weight:700; font-size:17px; letter-spacing:.03em; text-transform:uppercase}
.sect-count{margin-left:auto; font-family:var(--mono); font-size:11px; color:#8296AA}

.cat{
  font-family:var(--cond); font-weight:600; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-2); background:var(--field); padding:6px 16px;
  border-top:1px solid var(--rule-2); border-bottom:1px solid var(--rule-2);
}

.row{display:flex; align-items:flex-start; gap:12px; padding:9px 16px; border-bottom:1px solid var(--rule-2)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--field-2)}
.row-main{flex:1; min-width:0}
.row-d{font-size:14.5px; line-height:1.35}
.row-d mark{background:#FFE9A8; color:inherit; border-radius:1px; padding:0 1px}
.row-note{font-size:12.5px; color:var(--ink-3); margin-top:2px}
.row-where{
  font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-top:3px; display:none;
}
.searching .row-where{display:block}

.noterow{background:var(--amber-soft)}
.noterow:hover{background:var(--amber-soft)}
.noterow .row-d{font-size:13.5px; color:var(--amber); display:flex; gap:7px; align-items:flex-start}
.noterow .row-d svg{flex:none; margin-top:3px}

.row-right{display:flex; align-items:center; gap:8px; flex:none}
.pricecol{min-width:88px; text-align:right; flex:none}
.price{
  font-family:var(--mono); font-weight:600; font-size:16px; text-align:right;
  min-width:88px; letter-spacing:-.01em;
}
.base{
  font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-top:1px;
  letter-spacing:-.01em; white-space:nowrap;
}
.price.credit{color:var(--green)}
.tag{
  font-family:var(--cond); font-weight:600; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase;
  padding:3px 8px; border-radius:2px; text-align:center; min-width:88px;
}
.tag.std{background:var(--green-soft); color:var(--green)}
.tag.nc{background:var(--blue-soft); color:var(--blue)}
.tag.na{background:var(--field); color:var(--ink-3)}
.tag.txt{background:var(--amber-soft); color:var(--amber); min-width:0; text-transform:none; letter-spacing:0; font-size:12px}

.iconbtn{
  border:1px solid var(--rule); background:#fff; border-radius:3px; width:30px; height:30px;
  display:flex; align-items:center; justify-content:center; color:var(--ink-3); flex:none; padding:0;
}
.iconbtn:hover{border-color:var(--ink-2); color:var(--ink)}
.iconbtn.add:hover{border-color:var(--blue); color:var(--blue); background:var(--blue-soft)}
.iconbtn[aria-expanded="true"]{background:var(--ink); border-color:var(--ink); color:#fff}
.iconbtn.ghost{visibility:hidden}

/* compare fan-out */
.compare{padding:0 16px 12px 16px; background:var(--field-2); border-bottom:1px solid var(--rule-2)}
.compare-h{
  font-family:var(--cond); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); padding:9px 0 7px;
}
.cgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(122px,1fr)); gap:1px; background:var(--rule-2); border:1px solid var(--rule-2)}
.cell{background:#fff; padding:6px 9px}
.cell.on{background:var(--ink); color:#fff}
.cell-m{font-family:var(--cond); font-size:11px; letter-spacing:.02em; color:var(--ink-3); line-height:1.2}
.cell.on .cell-m{color:#9FBEDC}
.cell-v{font-family:var(--mono); font-weight:600; font-size:14px; margin-top:2px}
.cell-v.credit{color:var(--green)}
.cell.on .cell-v.credit{color:#6FD3AC}
.cell-v.mut{color:var(--ink-3); font-size:12px; font-weight:400}
.cell.on .cell-v.mut{color:#8FA4B8}

/* ---------- reference charts ---------- */
.reftbl{width:100%; border-collapse:collapse; font-size:13.5px}
.reftbl th{
  font-family:var(--cond); font-weight:600; font-size:11.5px; letter-spacing:.09em; text-transform:uppercase;
  text-align:left; padding:7px 12px; background:var(--field); border-bottom:1px solid var(--rule); color:var(--ink-2);
  position:sticky; top:186px;
}
.reftbl td{padding:6px 12px; border-bottom:1px solid var(--rule-2); vertical-align:top}
.reftbl td.num{font-family:var(--mono); font-size:13px}
.reftbl tr.sub td{
  font-family:var(--cond); font-weight:600; font-size:12px; letter-spacing:.11em; text-transform:uppercase;
  background:var(--field); color:var(--ink-2);
}
.reftbl tr:hover td{background:var(--field-2)}
.reftbl tr.sub:hover td{background:var(--field)}

/* ---------- empty ---------- */
.empty{background:var(--paper); border:1px solid var(--rule); border-radius:3px; padding:44px 24px; text-align:center}
.empty h3{font-family:var(--cond); font-size:19px; letter-spacing:.02em; margin:0 0 6px}
.empty p{color:var(--ink-3); margin:0 0 16px; font-size:14px}
.tryrow{display:flex; gap:6px; justify-content:center; flex-wrap:wrap}
.try{
  border:1px solid var(--rule); background:#fff; border-radius:2px; padding:5px 11px;
  font-family:var(--cond); font-weight:600; font-size:13px; color:var(--ink-2);
}
.try:hover{border-color:var(--blue); color:var(--blue); background:var(--blue-soft)}

/* ---------- quote dock ---------- */
.dock{
  --qc-bg:#101A26; --qc-bar-open:#101A26; --qc-border:#223446; --qc-border2:#2C3D50;
  --qc-surface:#1A2735; --qc-surface-focus:#1E2C3B; --qc-surface-hover:#26374A;
  --qc-text:#FFFFFF; --qc-text-dim:#B9C8D6; --qc-text-mute:#7E93A8; --qc-accent:#8FB6DA;
  --qc-btn-bg:#1E2C3B; --qc-btn-text:#D5E1EC; --qc-primary-bg:#FFFFFF; --qc-primary-text:#101A26; --qc-primary-hover:#DCE7F1;
  --qc-internal-bg:#182533; --qc-placeholder:#5E7488;
  position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--qc-bg); color:var(--qc-text);
  border-top:3px solid var(--blue); transform:translateY(calc(100% - 52px)); transition:transform .22s ease, background .15s, color .15s;
  max-height:100vh; max-height:100dvh; display:flex; flex-direction:column;
  box-shadow:0 -4px 18px rgba(16,26,38,.28);
}
.dock.light{
  --qc-bg:#FFFFFF; --qc-bar-open:#F6F8FA; --qc-border:#E4E9EE; --qc-border2:#D3DAE1;
  --qc-surface:#F6F8FA; --qc-surface-focus:#FFFFFF; --qc-surface-hover:#E7ECF1;
  --qc-text:#101A26; --qc-text-dim:#4A5A6C; --qc-text-mute:#78889A; --qc-accent:#1B5E9E;
  --qc-btn-bg:#F0F3F6; --qc-btn-text:#2A3A4C; --qc-primary-bg:#101A26; --qc-primary-text:#FFFFFF; --qc-primary-hover:#223449;
  --qc-internal-bg:#EEF3F7; --qc-placeholder:#9AA9B8;
}
.dock.open{transform:translateY(0)}
.dock-bar{
  display:flex; align-items:center; gap:14px; padding:0 20px; height:52px; flex:none; cursor:pointer;
  border:0; width:100%; text-align:left; background:var(--blue); transition:background .15s;
}
.dock-bar:hover{background:#1E6BAE}
.dock.open .dock-bar{background:var(--qc-bar-open)}
.dock-t{font-family:var(--cond); font-weight:700; font-size:14px; letter-spacing:.11em; text-transform:uppercase}
.dock-n{font-family:var(--mono); font-size:12px; color:#D3E6FA}
.dock.open .dock-n{color:var(--qc-accent)}
.dock-l{flex:1 1 0; display:flex; align-items:center; gap:14px; min-width:0}
.dock-r{flex:1 1 0; display:flex; justify-content:flex-end; min-width:0}
.dock-hint{
  flex:none; display:inline-flex; align-items:center; gap:7px; padding:7px 16px; border-radius:999px;
  background:#fff; color:#0F4C86; font-family:var(--cond); font-weight:800; font-size:14px; letter-spacing:.09em; text-transform:uppercase;
  box-shadow:0 2px 6px rgba(0,0,0,.28); white-space:nowrap}
.dock-hint .hint-c{display:none}
.dock-hint .hint-arrow{transition:transform .22s; animation:hintbob 1.6s ease-in-out infinite}
@keyframes hintbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.dock.open .dock-hint{background:var(--blue); color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.dock.open .dock-hint .hint-o{display:none}
.dock.open .dock-hint .hint-c{display:inline}
.dock.open .dock-hint .hint-arrow{transform:rotate(180deg); animation:none}
@media (max-width:560px){
  .dock-bar{padding:0 12px; gap:8px}
  .dock-hint{padding:7px 11px; font-size:12.5px}
  .dock-t{display:none}
  .dock-total{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.dock-hint .hint-arrow{animation:none}}
.dock-total{font-family:var(--mono); font-weight:600; font-size:19px}
.dock-caret{transition:transform .22s; color:#D3E6FA}
.dock.open .dock-caret{transform:rotate(180deg); color:var(--qc-accent)}
.dock-dm{
  position:absolute; top:12px; right:20px; z-index:2;
  border:1px solid rgba(255,255,255,.35); background:transparent; color:#fff; border-radius:3px;
  width:28px; height:28px; display:flex; align-items:center; justify-content:center; padding:0;
}
.dock-dm:hover{background:rgba(255,255,255,.15)}
.dock.open .dock-dm{border-color:var(--qc-border2); color:var(--qc-text-dim); top:12px}
.dock.open .dock-dm:hover{background:var(--qc-surface-hover); color:var(--qc-text)}
.dock-body{overflow-y:auto; padding:0 20px 20px; border-top:1px solid var(--qc-border); flex:1; min-height:0; color:var(--qc-text)}
.qmodel{font-family:var(--mono); font-size:11.5px; color:var(--qc-accent); padding:12px 0 8px; letter-spacing:.02em}
.qrow{display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--qc-border)}
.qrow-d{flex:1; min-width:0; font-size:14px; line-height:1.3}
.qrow-s{font-family:var(--mono); font-size:11px; color:var(--qc-text-mute); margin-top:2px}
.mktoggle{
  font-family:var(--cond); font-size:10.5px; font-weight:600; letter-spacing:.03em;
  border:1px solid var(--qc-border2); background:var(--qc-surface); color:var(--qc-accent); border-radius:9px;
  padding:1px 8px; margin-left:6px; vertical-align:middle;
}
.mktoggle[aria-pressed="true"]{background:#123A2B; border-color:#0D7A57; color:#6FD3AC}
.mktoggle[aria-pressed="false"]{background:#241A1A; border-color:#6B3A3A; color:#D89A9A}
.dock.light .mktoggle[aria-pressed="true"]{background:#E0F2EA; border-color:#0D7A57; color:#0D7A57}
.dock.light .mktoggle[aria-pressed="false"]{background:#FBEAEA; border-color:#B34D4D; color:#A23C3C}
.mktoggle:hover{filter:brightness(1.15)}
.qty{display:flex; align-items:center; border:1px solid var(--qc-border2); border-radius:3px; flex:none}
.qty button{border:0; background:transparent; color:var(--qc-text-dim); width:26px; height:28px; font-size:16px; line-height:1; padding:0}
.qty button:hover{color:var(--qc-text); background:var(--qc-surface-hover)}
.qty input{
  width:46px; border:0; background:transparent; color:var(--qc-text); text-align:center;
  font-family:var(--mono); font-size:13px; padding:0; -moz-appearance:textfield;
}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qprice{display:flex; align-items:center; gap:2px; flex:none; color:var(--qc-text-mute); font-family:var(--mono); font-size:12px}
.qprice input,.itemrow-in{
  width:84px; background:var(--qc-surface); border:1px solid var(--qc-border2); border-radius:3px; color:var(--qc-text);
  padding:5px 6px; font-family:var(--mono); font-size:13px; text-align:right; outline:0; -moz-appearance:textfield;
}
.itemrow-in{width:96px; font-weight:600}
.qprice input::-webkit-outer-spin-button,.qprice input::-webkit-inner-spin-button,
.itemrow-in::-webkit-outer-spin-button,.itemrow-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qprice input:focus,.itemrow-in:focus{border-color:#4E9BE0; background:var(--qc-surface-focus)}
@media (max-width:560px){.qrow{flex-wrap:wrap} .qrow-d{flex:1 1 100%}}
.qline{font-family:var(--mono); font-weight:600; font-size:14px; min-width:86px; text-align:right; flex:none; color:var(--qc-text)}
.qline.credit{color:#3BAE82}
.dock.light .qline.credit{color:#0D7A57}
.qdel{border:0;background:transparent;color:var(--qc-text-mute);padding:4px;flex:none;line-height:1}
.qdel:hover{color:#FF8B8B}
.custform{padding:14px 0 4px; border-bottom:1px solid var(--qc-border)}
.custform-h{
  font-family:var(--cond); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--qc-accent); margin-bottom:9px;
}
.qsect{padding:14px 0; border-bottom:1px solid var(--qc-border)}
.qsect-h{
  font-family:var(--cond); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--qc-accent); margin-bottom:9px; display:flex; align-items:baseline; gap:8px;
}
.qsect-sub{color:var(--qc-text-mute); font-size:10.5px; letter-spacing:.03em; text-transform:none; font-weight:400}
.miniadd{display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap}
.miniadd input{
  background:var(--qc-surface); border:1px solid var(--qc-border2); border-radius:3px; color:var(--qc-text);
  padding:6px 9px; font-family:var(--sans); font-size:13.5px; outline:0; min-width:0;
}
.miniadd input[type=text]{flex:2; min-width:140px}
.miniadd input[type=number]{flex:1; min-width:90px; font-family:var(--mono); text-align:right; -moz-appearance:textfield}
.miniadd input[type=number]::-webkit-outer-spin-button,.miniadd input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.miniadd input:focus{border-color:#4E9BE0; background:var(--qc-surface-focus)}
.miniadd button{flex:none}
.itemrow{display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--qc-border); font-size:13.5px}
.itemrow:last-child{border-bottom:0}
.itemrow-d{flex:1; min-width:0}
.itemrow-v{font-family:var(--mono); font-weight:600; font-size:14px; min-width:78px; text-align:right; flex:none}
.improw{display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--qc-border)}
.improw:last-child{border-bottom:0}
.improw-l{flex:1; font-size:13.5px; color:var(--qc-text)}
.improw-h{color:var(--qc-text-mute); font-size:11.5px; margin-left:5px}
.tbd{display:inline-flex; align-items:center; gap:5px; flex:none; cursor:pointer; font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--qc-text-mute); padding:4px 8px; border:1px solid var(--qc-border2); border-radius:4px; user-select:none}
.tbd input{margin:0; accent-color:var(--blue); cursor:pointer}
.tbd:hover{color:var(--qc-text)}
.tbd.on{background:var(--blue); border-color:var(--blue); color:#fff}
.impinput:disabled,.itemrow-in:disabled{opacity:.4; cursor:not-allowed}
.impinput,.taxinput{
  width:108px; background:var(--qc-surface); border:1px solid var(--qc-border2); border-radius:3px; color:var(--qc-text);
  padding:6px 8px; font-family:var(--mono); font-size:13px; text-align:right; outline:0; flex:none;
  -moz-appearance:textfield;
}
.impinput::-webkit-outer-spin-button,.impinput::-webkit-inner-spin-button,
.taxinput::-webkit-outer-spin-button,.taxinput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.seg{display:inline-flex; border:1px solid var(--qc-border2); border-radius:3px; overflow:hidden}
.seg button{
  border:0; background:var(--qc-surface); color:var(--qc-text-dim); padding:6px 14px;
  font-family:var(--cond); font-weight:600; font-size:12.5px; letter-spacing:.05em; text-transform:uppercase;
}
.seg button + button{border-left:1px solid var(--qc-border2)}
.seg button:hover{background:var(--qc-surface-hover); color:var(--qc-text)}
.seg button[aria-pressed="true"]{background:var(--blue); color:#fff}
.taxunit{color:var(--qc-text-dim); font-family:var(--mono); font-size:13px; margin-left:-4px}
.impinput:focus,.taxinput:focus{border-color:#4E9BE0; background:var(--qc-surface-focus)}
.subtot{display:flex; justify-content:space-between; padding-top:8px; margin-top:2px; border-top:1px dashed var(--qc-border2); font-size:13.5px; color:var(--qc-text)}
.subtot b{font-family:var(--mono); font-size:14.5px}
.grandtotals{padding:16px 0 4px}
.gline{display:flex; justify-content:space-between; padding:4px 0; font-size:14px; color:var(--qc-text-dim)}
.gline b{font-family:var(--mono); font-weight:600; color:var(--qc-text)}
.gline.grand{
  border-top:2px solid #4E9BE0; margin-top:8px; padding-top:12px; font-size:17px; color:var(--qc-text);
  font-family:var(--cond); font-weight:700; letter-spacing:.04em; text-transform:uppercase;
}
.gline.grand b{font-size:22px; font-family:var(--mono)}
.fgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:9px}
.field{display:flex; flex-direction:column; gap:3px; min-width:0}
.field label{font-size:11px; color:var(--qc-text-mute); letter-spacing:.03em}
.field input{
  background:var(--qc-surface); border:1px solid var(--qc-border2); border-radius:3px; color:var(--qc-text);
  padding:7px 9px; font-family:var(--sans); font-size:14px; outline:0; min-width:0;
}
.field input:focus{border-color:#4E9BE0; background:var(--qc-surface-focus)}
.field input::placeholder{color:var(--qc-placeholder)}
.field.wide{grid-column:span 2}
@media (max-width:560px){.field.wide{grid-column:auto}}

.internal{
  border:1px solid var(--qc-border2); border-radius:3px; padding:10px 12px; margin-top:14px; background:var(--qc-internal-bg);
}
.internal-h{
  font-family:var(--cond); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--qc-text-mute); margin-bottom:7px;
}
.iline{display:flex; align-items:baseline; gap:10px; font-size:13px; padding:2px 0; color:var(--qc-text)}
.iline span:first-child{color:var(--qc-text-dim)}
.iline b{margin-left:auto; font-family:var(--mono); font-weight:600; font-size:13.5px}
.iline.tot{border-top:1px solid var(--qc-border2); margin-top:6px; padding-top:6px}
.iline.tot b{font-size:15px}
.privacy{font-size:12px; color:var(--qc-text-mute); margin-top:10px; line-height:1.4}

.ptog{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:14px; padding:10px 12px; border:1px solid var(--qc-border2); border-radius:6px; background:var(--qc-surface)}
.ptog-label{font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--qc-text-mute)}
.ptog-seg{display:inline-flex; padding:3px; gap:3px; border-radius:999px; background:var(--qc-border2)}
.ptog-seg button{
  display:inline-flex; align-items:center; gap:7px; border:0; border-radius:999px; padding:8px 16px;
  font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; background:transparent; color:var(--qc-text-mute)}
.ptog-seg button:hover{color:var(--qc-text)}
.ptog-seg .dot{width:10px; height:10px; border-radius:50%; border:2px solid currentColor; box-sizing:border-box}
.ptog-seg button[aria-pressed="true"]{background:var(--blue); color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.35)}
.ptog-seg button[aria-pressed="true"] .dot{background:#fff; border-color:#fff}
.qfoot{display:flex; gap:8px; padding-top:14px; flex-wrap:wrap}
.qbtn{
  border:1px solid var(--qc-border2); background:var(--qc-btn-bg); color:var(--qc-btn-text); border-radius:3px; padding:7px 14px;
  font-family:var(--cond); font-weight:600; font-size:13px; letter-spacing:.05em; text-transform:uppercase;
}
.qbtn:hover{background:var(--qc-surface-hover); color:var(--qc-text)}
.qbtn.primary{background:var(--qc-primary-bg); color:var(--qc-primary-text); border-color:var(--qc-primary-bg)}
.qbtn.primary:hover{background:var(--qc-primary-hover)}
.qempty{padding:20px 0 6px; color:var(--qc-text-mute); font-size:14px}

.toast{
  position:fixed; left:50%; bottom:70px; transform:translate(-50%,12px); z-index:60;
  background:var(--ink); color:#fff; padding:9px 16px; border-radius:3px; font-size:13.5px;
  border-left:3px solid var(--blue); opacity:0; pointer-events:none; transition:opacity .18s,transform .18s;
}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:static; max-height:none; overflow:visible; padding:12px 16px 0;
    display:flex; gap:6px; overflow-x:auto; align-items:center; -webkit-overflow-scrolling:touch;
  }
  .rail-h{display:none}
  .navitem{width:auto; flex:none; border:1px solid var(--rule); background:#fff; white-space:nowrap; padding:6px 10px}
  .navitem .nav-c{display:none}
  .main{padding:14px 16px 130px}
  .reftbl th{position:static}
  .price,.tag{min-width:74px; font-size:15px}
  .mast-meta{display:none}
  .loctabsrow{padding:8px 16px 0}
  .loctab{padding:7px 14px 6px; font-size:11.5px}
}
@media (max-width:560px){
  .row{flex-wrap:wrap}
  .row-right{width:100%; justify-content:flex-end}
}

/* ---------- print ---------- */
@media print{
  .masthead,.rail,.dock,.toast,.iconbtn,.empty,#results,.statusline{display:none !important}
  body{background:#fff; font-size:11pt}
  .main{padding:0}
  #printquote{display:block !important}
}
#printquote{display:none}
#printquote h1{font-family:var(--cond); font-size:22pt; letter-spacing:.03em; text-transform:uppercase; margin:0 0 2px}
#printquote .pmeta{font-family:var(--mono); font-size:9pt; color:#555; margin-bottom:16px}
#printquote table{width:100%; border-collapse:collapse; font-size:10.5pt}
#printquote th{text-align:left; border-bottom:2px solid #000; padding:5px 6px; font-family:var(--cond); text-transform:uppercase; font-size:9pt; letter-spacing:.08em}
#printquote td{border-bottom:1px solid #ccc; padding:5px 6px; vertical-align:top}
#printquote td.n{font-family:var(--mono); text-align:right; white-space:nowrap}
#printquote tr.tot td{border-top:2px solid #000; border-bottom:0; font-weight:700; font-size:12pt; padding-top:8px}
#printquote .who{
  border:1px solid #000; padding:8px 10px; margin-bottom:14px; font-size:10.5pt; line-height:1.5;
}
#printquote .who b{font-family:var(--cond); text-transform:uppercase; font-size:8.5pt; letter-spacing:.08em; color:#555; font-weight:600}
#printquote .intbanner{
  background:#000; color:#fff; padding:6px 10px; font-family:var(--cond); font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; font-size:10pt; margin-bottom:12px;
}
/* Force bar colors to print even when the print dialog's "Background graphics" box is unchecked */
#printquote, #printquote *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
#printquote .pbar{
  background:#101A26; color:#fff; padding:6px 10px; margin:16px 0 0; font-family:var(--cond);
  font-weight:700; letter-spacing:.09em; text-transform:uppercase; font-size:10pt;
}
#printquote .pbar:first-of-type{margin-top:10px}
#printquote table + .pbar{margin-top:16px}
#printquote .psubtot{
  display:flex; justify-content:space-between; border-top:2px solid #000; padding:6px 6px 10px;
  font-weight:700; font-size:11pt;
}
#printquote .prow{display:flex; justify-content:space-between; padding:5px 6px; border-bottom:1px solid #ccc; font-size:10.5pt}
#printquote .prow-tot{font-weight:700; border-top:1px solid #000; border-bottom:2px solid #000}
#printquote .ptotal{
  display:flex; justify-content:space-between; align-items:center; background:#101A26; color:#fff;
  padding:11px 12px; font-weight:700; font-size:13pt; margin-top:4px; font-family:var(--cond);
  text-transform:uppercase; letter-spacing:.03em;
}
#printquote .ptotal b{font-family:var(--mono); font-size:15pt; text-transform:none; letter-spacing:0}
#printquote .disc{margin-top:18px; font-size:8.5pt; color:#555; line-height:1.4}
</style>

<script>
(function(){
'use strict';
const BOOKS = JSON.parse(document.getElementById('data').textContent).books;
const LOCATIONS = [
  {id:'hermiston', label:'Hermiston'},
  {id:'albany', label:'Albany'}
];
let DATA, MODELS, ITEMS;

/* short labels for the chips */
function shortModel(m){
  return m.replace(/Columbia River/,'Columbia River')
          .replace(/Majestic Collection/,'Majestic');
}

const state = {
  location: 'hermiston',
  modelByLoc: {hermiston: 2, albany: 0},
  model: 2,
  q: '',
  view: {type:'all'},
  quote: [],
  open: new Set(),
  markup: {on:true, pct:20},
  cust: {name:'', contact:'', home:'', basePrice:'', by:''},
  onsite: [],
  incentives: [],   /* credits to the customer: entered as positive dollars, subtracted from the total */
  improve: {foundation:'', excavation:'', electric:'', septic:'', water:'', decks:'', sidewalks:'', awnings:'', permits:''},
  other: [],
  taxAmt: '',
  taxPct: '',
  taxMode: 'amt',   /* 'amt' = type the dollar amount, 'pct' = type a rate and let it calculate */
  _seq: 0,
  quoteLight: false,
  improveTbd: {},   /* site-improvement lines marked TBD: amount prints as TBD and counts as $0 */
  itemize: false,   /* customer print: false = one options total, true = every option listed */
};

/* Base prices from the book are internal. mk() is the only place markup is
   applied, and nothing that leaves this screen (print / copy for customer)
   is ever allowed to reference the base figure or the percentage. */
function mk(n){
  if (!state.markup.on || !state.markup.pct) return n;
  return Math.round(n * (1 + state.markup.pct / 100) * 100) / 100;
}
function markupLive(){ return state.markup.on && state.markup.pct > 0; }

/* Home-options items normally follow the global markup toggle. Custom items
   carry their own mkOn flag so it can be switched off per item; book items
   never set mkOn and always defer to the global toggle. */
function priceFor(q){ return q.mkOn === false ? q.unit : mk(q.unit); }
function itemMarkupOn(q){ return q.mkOn !== false && markupLive(); }

/* A quote can end up with items added under different locations (the
   person switched the tab mid-quote). Each such item remembers which
   location's book it came from, so its series name always resolves
   against the right MODELS list, never the one currently on screen. */
function modelsFor(loc){ return (BOOKS[loc] || BOOKS.hermiston).models; }
function seriesNameFor(q){ return modelsFor(q.loc || 'hermiston')[q.model] || ''; }
function seriesKey(q){ return (q.loc || 'hermiston') + ':' + q.model; }

/* ---------- flatten ---------- */
function buildItems(loc){
  const d = BOOKS[loc];
  const items = [];
  d.sections.forEach((s, si) => {
    s.items.forEach((it, ii) => {
      const notes = it.notes || [];
      items.push({
        key: loc + ':' + si + ':' + ii,
        loc, si, code: s.code, section: s.label, cat: it.c || '', desc: it.d,
        p: it.p, note: !it.p, notes,
        hay: (s.code + ' ' + s.label + ' ' + (it.c||'') + ' ' + it.d + ' ' + notes.join(' ')).toLowerCase()
      });
    });
  });
  return items;
}

function setLocation(loc){
  state.location = loc;
  DATA = BOOKS[loc];
  MODELS = DATA.models;
  ITEMS = buildItems(loc);
  state.model = state.modelByLoc[loc] ?? 0;
  state.open.clear();
  state.view = {type:'all'};
  renderLocationTabs();
  renderChips();
  renderRail();
  renderResults();
  updateStamp();
}

function updateStamp(){
  document.getElementById('stamp').textContent =
    ITEMS.filter(i => !i.note).length + ' options \u00b7 ' + DATA.sections.length + ' sections \u00b7 ' +
    (state.location === 'albany' ? 'Albany book' : 'book 9/29/26');
}

function renderLocationTabs(){
  document.getElementById('loctabs').innerHTML = LOCATIONS.map(l =>
    '<button class="loctab" data-loc="' + l.id + '" aria-pressed="' + (state.location === l.id) + '">' + esc(l.label) + '</button>'
  ).join('');
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function money(n){
  const a = Math.abs(n);
  const s = a.toLocaleString('en-US', {minimumFractionDigits: a % 1 ? 2 : 0, maximumFractionDigits: 2});
  return (n < 0 ? '\u2212$' : '$') + s;
}

function tokens(){ return state.q.toLowerCase().split(/\s+/).filter(Boolean); }

function highlight(text){
  const ts = tokens();
  let out = esc(text);
  if (!ts.length) return out;
  ts.forEach(t => {
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    out = out.replace(re, '\u0001$1\u0002');
  });
  return out.replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');
}

function matches(){
  const ts = tokens();
  let list = ITEMS;
  if (state.view.type === 'section') list = list.filter(i => i.code === state.view.code);
  if (ts.length) list = list.filter(i => ts.every(t => i.hay.indexOf(t) !== -1));
  return list;
}

/* value classification */
function classify(v){
  if (typeof v === 'number') return {kind:'num', v};
  const s = String(v || '').trim();
  if (!s) return {kind:'blank'};
  const u = s.toLowerCase();
  if (u === 'std') return {kind:'std', label:'Standard'};
  if (u === 'nc') return {kind:'nc', label:'No charge'};
  if (u === 'n/a' || u === 'na') return {kind:'na', label:'Not available'};
  const n = Number(s.replace(/[$,]/g, ''));
  if (!isNaN(n) && s !== '') return {kind:'num', v:n};
  return {kind:'txt', label:s};
}

function priceHTML(v){
  const c = classify(v);
  if (c.kind === 'num'){
    const m = mk(c.v);
    const showBase = markupLive();
    return '<div class="pricecol"><div class="price' + (m < 0 ? ' credit' : '') + '">' + money(m) + '</div>' +
           (showBase ? '<div class="base">base ' + money(c.v) + '</div>' : '') + '</div>';
  }
  if (c.kind === 'blank') return '<div class="price" style="color:var(--ink-3)">&mdash;</div>';
  if (c.kind === 'txt') return '<div class="tag txt">' + esc(c.label) + '</div>';
  return '<div class="tag ' + c.kind + '">' + c.label + '</div>';
}

/* ---------- masthead ---------- */
function renderChips(){
  document.getElementById('chips').innerHTML = MODELS.map((m, i) =>
    '<button class="chip" data-m="' + i + '" aria-pressed="' + (i === state.model) + '">' + esc(shortModel(m)) + '</button>'
  ).join('');
}

/* ---------- rail ---------- */
function renderRail(){
  const ts = tokens();
  const counts = {};
  ITEMS.forEach(i => {
    if (i.note) return;
    if (!ts.length || ts.every(t => i.hay.indexOf(t) !== -1)) counts[i.code] = (counts[i.code] || 0) + 1;
  });
  const total = Object.values(counts).reduce((a, b) => a + b, 0);

  let h = '<h2 class="rail-h">Sections</h2>';
  h += '<button class="navitem" data-nav="all" aria-current="' + (state.view.type === 'all') + '">' +
       '<span class="nav-n">\u2022</span><span class="nav-t">All options</span><span class="nav-c">' + total + '</span></button>';
  DATA.sections.forEach(s => {
    const n = counts[s.code] || 0;
    h += '<button class="navitem' + (n === 0 ? ' dim' : '') + '" data-nav="sec" data-code="' + esc(s.code) + '"' +
         ' aria-current="' + (state.view.type === 'section' && state.view.code === s.code) + '">' +
         '<span class="nav-n">' + esc(s.code) + '</span><span class="nav-t">' + esc(s.label) + '</span>' +
         '<span class="nav-c">' + n + '</span></button>';
  });
  h += '<h2 class="rail-h">Charts &amp; reference</h2>';
  Object.keys(DATA.refs).forEach(k => {
    h += '<button class="navitem" data-nav="ref" data-ref="' + k + '"' +
         ' aria-current="' + (state.view.type === 'ref' && state.view.ref === k) + '">' +
         '<span class="nav-n">\u2500</span><span class="nav-t">' + esc(DATA.refs[k].title) + '</span></button>';
  });
  document.getElementById('rail').innerHTML = h;
}

/* ---------- results ---------- */
function renderResults(){
  const results = document.getElementById('results');
  const status = document.getElementById('status');
  document.body.classList.toggle('searching', tokens().length > 0);

  if (state.view.type === 'ref'){
    const r = DATA.refs[state.view.ref];
    status.innerHTML = '<span class="pill">Reference</span> <b>' + esc(r.title) + '</b> &mdash; from the printed book, unchanged';
    results.innerHTML = renderRef(r);
    return;
  }

  const list = matches();
  const nPriced = list.filter(i => !i.note).length;
  const bits = [];
  bits.push('<b>' + nPriced + '</b> option' + (nPriced === 1 ? '' : 's'));
  if (state.q) bits.push('matching \u201c<b>' + esc(state.q) + '</b>\u201d');
  if (state.view.type === 'section'){
    const s = DATA.sections.find(x => x.code === state.view.code);
    bits.push('in <b>' + esc(s.label) + '</b>');
  }
  status.innerHTML = bits.join(' ') + ' <span class="pill">' + esc(MODELS[state.model]) + '</span>';

  if (!nPriced && !list.length){
    results.innerHTML = '<div class="empty"><h3>Nothing matched that</h3>' +
      '<p>Try a shorter word, or a different one \u2014 the book calls things by their spec name.</p>' +
      '<div class="tryrow">' +
      ['metal roof','window','dormer','dishwasher','deck','tub','counter','ceiling fan','insulation']
        .map(t => '<button class="try" data-try="' + t + '">' + t + '</button>').join('') +
      '</div></div>';
    return;
  }

  /* group by section, then category */
  const bySec = new Map();
  list.forEach(i => {
    if (!bySec.has(i.code)) bySec.set(i.code, {label:i.section, cats:new Map()});
    const g = bySec.get(i.code);
    if (!g.cats.has(i.cat)) g.cats.set(i.cat, []);
    g.cats.get(i.cat).push(i);
  });

  let h = '';
  bySec.forEach((g, code) => {
    h += '<section class="sect"><div class="sect-h">' +
         '<span class="sect-code">' + esc(code) + '</span>' +
         '<span class="sect-name">' + esc(g.label) + '</span>' +
         '<span class="sect-count">' + Array.from(g.cats.values()).reduce((a, b) => a + b.filter(x => !x.note).length, 0) + '</span></div>';
    g.cats.forEach((items, cat) => {
      if (cat) h += '<div class="cat">' + highlight(cat) + '</div>';
      items.forEach(it => { h += rowHTML(it); });
    });
    h += '</section>';
  });
  results.innerHTML = h;
}

function rowHTML(it){
  if (it.note){
    return '<div class="row noterow"><div class="row-main"><div class="row-d">' +
           '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/></svg> ' +
           highlight(it.desc) + '</div>' +
           '<div class="row-where">' + esc(it.code) + ' \u00b7 ' + esc(it.section) + (it.cat ? ' \u203a ' + esc(it.cat) : '') + '</div>' +
           '</div></div>';
  }
  const v = it.p[state.model];
  const c = classify(v);
  const canAdd = c.kind === 'num' && c.v !== 0;
  const canCompare = MODELS.length > 1;
  const open = canCompare && state.open.has(it.key);

  let h = '<div class="row">';
  h += '<div class="row-main"><div class="row-d">' + highlight(it.desc) + '</div>';
  it.notes.forEach(n => { h += '<div class="row-note">' + highlight(n) + '</div>'; });
  h += '<div class="row-where">' + esc(it.code) + ' \u00b7 ' + esc(it.section) + (it.cat ? ' \u203a ' + esc(it.cat) : '') + '</div>';
  h += '</div><div class="row-right">' + priceHTML(v);
  h += canCompare
    ? '<button class="iconbtn" data-cmp="' + it.key + '" aria-expanded="' + open + '" title="Compare all series">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18V9M10 18V5M16 18v-6M22 18V8"/></svg></button>'
    : '';
  h += canAdd
    ? '<button class="iconbtn add" data-add="' + it.key + '" title="Add to quote">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>'
    : '<span class="iconbtn ghost"></span>';
  h += '</div></div>';

  if (open){
    h += '<div class="compare"><div class="compare-h">Price by series &amp; width' +
         (markupLive() ? ' \u2014 with markup' : '') + '</div><div class="cgrid">';
    MODELS.forEach((m, i) => {
      const cc = classify(it.p[i]);
      let val, cls = 'cell-v';
      if (cc.kind === 'num'){ const mv = mk(cc.v); val = money(mv); if (mv < 0) cls += ' credit'; }
      else if (cc.kind === 'blank'){ val = '\u2014'; cls += ' mut'; }
      else { val = cc.label; cls += ' mut'; }
      h += '<div class="cell' + (i === state.model ? ' on' : '') + '">' +
           '<div class="cell-m">' + esc(shortModel(m)) + '</div>' +
           '<div class="' + cls + '">' + esc(val) + '</div></div>';
    });
    h += '</div></div>';
  }
  return h;
}

function renderRef(r){
  const rows = r.rows;
  let headIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 4); i++){
    if (rows[i].filter(Boolean).length > 1){ headIdx = i; break; }
  }
  let h = '<section class="sect"><div class="sect-h"><span class="sect-name">' + esc(r.title) + '</span></div>';
  h += '<div style="overflow-x:auto"><table class="reftbl">';
  rows.forEach((row, i) => {
    if (i === 0 && row.length === 1 && row[0].toLowerCase().replace(/[^a-z]/g,'') === r.title.toLowerCase().replace(/[^a-z]/g,'')) return;
    const filled = row.filter(Boolean).length;
    if (i === headIdx){
      h += '<thead><tr>' + row.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>';
      return;
    }
    if (filled === 1 && row.length <= 2){
      h += '<tr class="sub"><td colspan="12">' + esc(row.filter(Boolean)[0]) + '</td></tr>';
      return;
    }
    h += '<tr>' + row.map(c => {
      const isNum = /^[\d$.,'\s\-\u2212"\/]+$/.test(c) && /\d/.test(c);
      return '<td class="' + (isNum ? 'num' : '') + '">' + esc(c) + '</td>';
    }).join('') + '</tr>';
  });
  h += '</tbody></table></div></section>';
  return h;
}

/* ---------- quote ---------- */
function addToQuote(key){
  const it = ITEMS.find(i => i.key === key);
  if (!it) return;
  const c = classify(it.p[state.model]);
  if (c.kind !== 'num') return;
  const id = key + '@' + state.model;
  const ex = state.quote.find(q => q.id === id);
  if (ex){ ex.qty += 1; }
  else state.quote.push({id, key, loc:it.loc, desc:it.desc, section:it.section, code:it.code, model:state.model, unit:c.v, qty:1});
  toast(ex ? 'Quantity updated' : 'Added to quote');
  renderQuote();
}

const IMP_FIELDS = [
  ['foundation', 'Foundation', ''],
  ['excavation', 'Excavation & Backfill', ''],
  ['electric', 'Electric', 'service & connections'],
  ['septic', 'Septic / Sewer', 'system or connection'],
  ['water', 'Well or Water Connection', ''],
  ['decks', 'Decks', ''],
  ['sidewalks', 'Sidewalks & Slabs', ''],
  ['awnings', 'Awnings', ''],
  ['permits', 'Permits', 'building, plumbing, electrical, etc.']
];

function customerTotal(){ return state.quote.reduce((a, q) => a + priceFor(q) * q.qty, 0); }
function baseTotal(){ return state.quote.reduce((a, q) => a + q.unit * q.qty, 0); }
function basePrice(){ const v = parseFloat(state.cust.basePrice); return isNaN(v) ? 0 : v; }
function homeSubtotal(){ return basePrice() + customerTotal(); }
function onsiteTotal(){ return state.onsite.reduce((a, i) => a + (parseFloat(i.amount) || 0), 0); }
function improveFixedTotal(){ return IMP_FIELDS.reduce((a, [k]) => a + (state.improveTbd[k] ? 0 : (parseFloat(state.improve[k]) || 0)), 0); }
function improveOtherTotal(){ return state.other.reduce((a, i) => a + (i.tbd ? 0 : (parseFloat(i.amount) || 0)), 0); }
function tbdBox(attr, on){ return '<label class="tbd' + (on ? ' on' : '') + '" title="Amount to be determined \u2014 prints as TBD and counts as $0"><input type="checkbox" ' + attr + (on ? ' checked' : '') + '><span>TBD</span></label>'; }
function improvementsSubtotal(){ return improveFixedTotal() + improveOtherTotal(); }
function incentivesTotal(){ return state.incentives.reduce((a, i) => a + (parseFloat(i.amount) || 0), 0); }
function taxableSubtotal(){ return homeSubtotal() + onsiteTotal() + improvementsSubtotal(); }
function salesTax(){
  if (state.taxMode === 'pct'){
    const r = parseFloat(state.taxPct);
    if (isNaN(r) || r <= 0) return 0;
    return Math.round(taxableSubtotal() * r / 100 * 100) / 100;
  }
  const v = parseFloat(state.taxAmt);
  return isNaN(v) ? 0 : v;
}
function grandTotal(){ return taxableSubtotal() + salesTax() - incentivesTotal(); }

/* Every line in the quote needs an ID that is unique across ALL lists. The counter
   restarts at 0 each time the page opens, so when a saved quote is reopened we must
   never hand out an ID that a saved line already has. */
function idTaken(id){
  return state.quote.some(x => x.id === id) || state.onsite.some(x => x.id === id) || state.other.some(x => x.id === id) || state.incentives.some(x => x.id === id);
}
function newId(prefix){
  let id;
  do { id = prefix + (++state._seq); } while (idTaken(id));
  return id;
}
/* Run after opening a saved file: move the counter past every saved ID and repair
   any duplicates already baked into files saved before this fix. */
function normalizeIds(){
  let max = 0;
  [state.quote, state.onsite, state.other, state.incentives].forEach(arr => arr.forEach(x => {
    const m = /^(?:cu|os|ot|in)(\d+)$/.exec(x.id || '');
    if (m) max = Math.max(max, parseInt(m[1], 10));
  }));
  state._seq = Math.max(state._seq, max);
  const seen = new Set();
  [[state.quote, 'cu'], [state.onsite, 'os'], [state.other, 'ot'], [state.incentives, 'in']].forEach(([arr, pre]) => arr.forEach(x => {
    if (!x.id || seen.has(x.id)) x.id = newId(x.code && x.code !== 'CUSTOM' ? 'bk' : pre);
    seen.add(x.id);
  }));
}

function itemRow(i, kind){
  return '<div class="itemrow"><div class="itemrow-d">' + esc(i.desc) + '</div>' +
         (kind === 'other' ? tbdBox('data-othtbd="' + i.id + '"', !!i.tbd) : '') +
         '<input class="itemrow-in" type="number" step="0.01" value="' + esc(i.amount) + '" data-xamt="' + kind + ':' + i.id + '" aria-label="Amount" title="Edit amount"' + (kind === 'other' && i.tbd ? ' disabled' : '') + '>' +
         '<button class="qdel" data-delx="' + kind + ':' + i.id + '" aria-label="Remove">' +
         '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
}

       'The internal copy shows both. <b>Save quote file</b> downloads a file you can reopen later to make changes for this customer.</div>';
  body.innerHTML = h;
}


function fmtDate(){ return new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'}); }

function homeLine(){
  const h = state.cust.home.trim();
  if (!h) return '';
  const rec = (BOOKS.hermiston.homes || []).find(x => x.m.toLowerCase() === h.toLowerCase());
  return rec ? rec.m + ' \u2014 ' + rec.s : h;
}

function headerBlock(){
  const c = state.cust;
  const mixed = new Set(state.quote.map(seriesKey)).size > 1;
  const rows = [];
  if (c.name.trim())    rows.push('<b>Customer</b> ' + esc(c.name));
  if (c.contact.trim()) rows.push('<b>Contact</b> ' + esc(c.contact));
  const hl = homeLine();
  if (hl) rows.push('<b>Home model</b> ' + esc(hl));
  if (c.by.trim())      rows.push('<b>Prepared by</b> ' + esc(c.by));
  return rows.length ? '<div class="who">' + rows.join('<br>') + '</div>' : '';
}

/* buildPrint(false) is the customer sheet: marked-up prices only. Nothing in
   it references the base figure or the markup percentage.
   buildPrint(true) is the internal sheet and additionally shows the base
   cost and markup behind the home options. */
function buildPrint(internal){
  const c = state.cust;
  const mixed = new Set(state.quote.map(seriesKey)).size > 1;
  const showMk = internal && markupLive();
  let h = '';
  if (internal) h += '<div class="intbanner">Internal copy \u2014 not for the customer</div>';
  h += '<div class="pmeta">' + fmtDate() + '</div>';
  h += headerBlock();

  /* -- Base home + options -- */
  h += '<div class="pbar">Base Home</div>';
  h += '<table><tbody><tr><td>Base home price</td><td class="n">' + money(basePrice()) + '</td></tr></tbody></table>';

  if (state.quote.length){
    if (!internal && !state.itemize){
      /* customer sheet: one lump sum, no itemized options */
      h += '<div class="pbar">Home Options / Upgrades</div>';
      h += '<table><tbody><tr><td>Total home options &amp; upgrades</td><td class="n">' + money(customerTotal()) + '</td></tr></tbody></table>';
    } else {
    h += '<div class="pbar">Home Options / Upgrades (' + state.quote.length + ')</div>';
    h += '<table><thead><tr><th>Qty</th><th>Option</th>';
    h += showMk ? '<th style="text-align:right">Base ea</th>' : '';
    h += '<th style="text-align:right">Each</th><th style="text-align:right">Amount</th></tr></thead><tbody>';
    state.quote.forEach(q => {
      const cu = priceFor(q);
      h += '<tr><td class="n">' + q.qty + '</td><td>' + esc(q.desc) +
           (internal && q.code === 'CUSTOM' && q.mkOn === false ? '<br><small>No markup applied</small>' : '') +
           (internal && q.orig !== undefined ? '<br><small>Price edited (book ' + money(q.orig) + ')</small>' : '') + '</td>' +
           (showMk ? '<td class="n">' + money(q.unit) + '</td>' : '') +
           '<td class="n">' + money(cu) + '</td><td class="n">' + money(cu * q.qty) + '</td></tr>';
    });
    h += '</tbody></table>';
    if (showMk){
      h += '<div class="prow"><span>Options base total</span><b>' + money(baseTotal()) + '</b></div>' +
           '<div class="prow"><span>Markup ' + state.markup.pct + '%</span><b>' + money(customerTotal() - baseTotal()) + '</b></div>' +
           '<div class="prow prow-tot"><span>Options, marked up</span><b>' + money(customerTotal()) + '</b></div>';
    }    }
  }
  h += '<div class="psubtot"><span>Home Subtotal (Base + Options)</span><b>' + money(homeSubtotal()) + '</b></div>';

  /* -- On-site add-ons -- */
  if (state.onsite.length){
    h += '<div class="pbar">On-Site Home Add-Ons (' + state.onsite.length + ')</div>';
    h += '<table><thead><tr><th>Description</th><th style="text-align:right">Amount</th></tr></thead><tbody>';
    state.onsite.forEach(i => { h += '<tr><td>' + esc(i.desc) + '</td><td class="n">' + money(parseFloat(i.amount) || 0) + '</td></tr>'; });
    h += '</tbody></table>';
    h += '<div class="psubtot"><span>On-Site Add-Ons Subtotal</span><b>' + money(onsiteTotal()) + '</b></div>';
  }

  /* -- Site improvements -- */
  const impRows = IMP_FIELDS.filter(([k]) => state.improveTbd[k] || parseFloat(state.improve[k]) > 0);
  if (impRows.length || state.other.length){
    h += '<div class="pbar">Site Improvements</div>';
    h += '<table><thead><tr><th>Item</th><th style="text-align:right">Amount</th></tr></thead><tbody>';
    impRows.forEach(([k, label, hint]) => {
      h += '<tr><td>' + esc(label) + (hint ? '<br><small>' + esc(hint) + '</small>' : '') + '</td><td class="n">' + (state.improveTbd[k] ? 'TBD' : money(parseFloat(state.improve[k]))) + '</td></tr>';
    });
    state.other.forEach(i => { h += '<tr><td>' + esc(i.desc) + '</td><td class="n">' + (i.tbd ? 'TBD' : money(parseFloat(i.amount) || 0)) + '</td></tr>'; });
    h += '</tbody></table>';
    h += '<div class="psubtot"><span>Improvements Subtotal</span><b>' + money(improvementsSubtotal()) + '</b></div>';
  }

  /* -- Incentives -- */
  if (state.incentives.length){
    h += '<div class="pbar">Incentives</div>';
    h += '<table><thead><tr><th>Description</th><th style="text-align:right">Amount</th></tr></thead><tbody>';
    state.incentives.forEach(i => { h += '<tr><td>' + esc(i.desc) + '</td><td class="n">' + money(-(parseFloat(i.amount) || 0)) + '</td></tr>'; });
    h += '</tbody></table>';
    h += '<div class="psubtot"><span>Incentives Total</span><b>' + money(-incentivesTotal()) + '</b></div>';
  }

  /* -- Package summary -- */
  h += '<div class="pbar">Package Summary</div>';
  h += '<div class="prow"><span>Home (Base + Options)</span><b>' + money(homeSubtotal()) + '</b></div>' +
       '<div class="prow"><span>On-Site Home Add-Ons</span><b>' + money(onsiteTotal()) + '</b></div>' +
       '<div class="prow"><span>Site Improvements</span><b>' + money(improvementsSubtotal()) + '</b></div>' +
       '<div class="prow"><span>Sales Tax</span><b>' + money(salesTax()) + '</b></div>' +
       (state.incentives.length ? '<div class="prow"><span>Incentives</span><b>' + money(-incentivesTotal()) + '</b></div>' : '');
  h += '<div class="ptotal"><span>Total</span><b>' + money(grandTotal()) + '</b></div>';

  h += '<div class="disc">This summary is provided for discussion and estimating purposes only and is not a binding contract, offer, or financing commitment. ' +
       'Site improvement and add-on costs are estimates that may vary with final site conditions, engineering, and permitting requirements. ' +
       'Pricing is per the sales book in effect on the date of this quote and is subject to change; final terms are governed by your signed purchase agreement.</div>';
  document.getElementById('printquote').innerHTML = h;
}

const FIELD_IDS = {name:'cname', contact:'ccontact', home:'chome', basePrice:'cbase', by:'cby'};

function serializeQuote(){
  return {
    v: 2, saved: new Date().toISOString(),
    cust: state.cust,
    markup: state.markup,
    quote: state.quote,
    onsite: state.onsite,
    incentives: state.incentives,
    improve: state.improve,
    other: state.other,
    improveTbd: state.improveTbd,
    taxAmt: state.taxAmt,
    taxPct: state.taxPct,
    taxMode: state.taxMode,
    itemize: !!state.itemize
  };
}

function slugify(s){
  return (s || 'quote').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'quote';
}

function saveQuoteFile(){
  const blob = new Blob([JSON.stringify(serializeQuote(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = slugify(state.cust.name) + '_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Quote file downloaded');
}

function loadQuoteFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch(e){ toast('That file could not be read'); return; }
    if (!data || !Array.isArray(data.quote)){ toast('Not a quote file'); return; }
    state.cust = Object.assign({name:'', contact:'', home:'', basePrice:'', by:''}, data.cust || {});
    delete state.cust.no;   /* quote numbers were retired; ignore one stored in an older file */
    if (data.markup) state.markup = Object.assign({on:true, pct:20}, data.markup);
    state.quote = data.quote;
    state.onsite = Array.isArray(data.onsite) ? data.onsite : [];
    state.incentives = Array.isArray(data.incentives) ? data.incentives : [];
    state.improve = Object.assign({foundation:'', excavation:'', electric:'', septic:'', water:'', decks:'', sidewalks:'', awnings:'', permits:''}, data.improve || {});
    state.other = Array.isArray(data.other) ? data.other : [];
    state.improveTbd = (data.improveTbd && typeof data.improveTbd === 'object') ? Object.assign({}, data.improveTbd) : {};
    normalizeIds();
    state.itemize = data.itemize === true;
    state.taxAmt = ''; state.taxPct = ''; state.taxMode = 'amt';
    if (data.taxMode === 'pct' || data.taxMode === 'amt'){
      state.taxMode = data.taxMode;
      state.taxAmt = data.taxAmt === undefined ? '' : data.taxAmt;
      state.taxPct = data.taxPct === undefined ? '' : data.taxPct;
    } else {
      /* files saved before the toggle existed */
      if (data.taxAmt !== undefined && data.taxAmt !== '') state.taxAmt = data.taxAmt;
      else if (parseFloat(data.taxPct) > 0){
        /* the oldest files stored a percentage: convert it to the dollar amount it produced */
        state.taxAmt = Math.round(taxableSubtotal() * parseFloat(data.taxPct) / 100 * 100) / 100;
      }
    }
    Object.keys(FIELD_IDS).forEach(k => { document.getElementById(FIELD_IDS[k]).value = state.cust[k] || ''; });
    syncMarkupUI();
    dock.classList.add('open'); document.getElementById('dockbar').setAttribute('aria-expanded', true);
    renderResults(); renderQuote();
    toast('Quote loaded \u2014 ' + (state.cust.name || 'customer'));
  };
  reader.readAsText(file);
}

let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1500);
}

/* ---------- events ---------- */
const qEl = document.getElementById('q');
qEl.addEventListener('input', () => {
  state.q = qEl.value.trim();
  document.getElementById('clear').classList.toggle('on', !!state.q);
  state.open.clear();
  renderRail(); renderResults();
});
document.getElementById('clear').addEventListener('click', () => {
  qEl.value = ''; state.q = '';
  document.getElementById('clear').classList.remove('on');
  renderRail(); renderResults(); qEl.focus();
});

document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-m]'); if (!b) return;
  state.model = +b.dataset.m;
  renderChips(); renderResults(); renderQuote();
});

document.getElementById('rail').addEventListener('click', e => {
  const b = e.target.closest('[data-nav]'); if (!b) return;
  const k = b.dataset.nav;
  state.view = k === 'all' ? {type:'all'} : k === 'sec' ? {type:'section', code:b.dataset.code} : {type:'ref', ref:b.dataset.ref};
  state.open.clear();
  renderRail(); renderResults();
  window.scrollTo({top:0, behavior:'smooth'});
});

document.getElementById('results').addEventListener('click', e => {
  const cmp = e.target.closest('[data-cmp]');
  if (cmp){
    const k = cmp.dataset.cmp;
    state.open.has(k) ? state.open.delete(k) : state.open.add(k);
    renderResults(); return;
  }
  const add = e.target.closest('[data-add]');
  if (add){ addToQuote(add.dataset.add); return; }
  const t = e.target.closest('[data-try]');
  if (t){
    qEl.value = t.dataset.try; state.q = t.dataset.try;
    document.getElementById('clear').classList.add('on');
    state.view = {type:'all'};
    renderRail(); renderResults(); return;
  }
});

const mkon = document.getElementById('mkon');
const pctEl = document.getElementById('pct');
function syncMarkupUI(){
  mkon.setAttribute('aria-checked', state.markup.on);
  document.getElementById('mkctrl').classList.toggle('off', !state.markup.on);
  pctEl.disabled = !state.markup.on;
}
mkon.addEventListener('click', () => {
  state.markup.on = !state.markup.on;
  syncMarkupUI(); renderResults(); renderQuote();
});
pctEl.addEventListener('input', () => {
  const v = parseFloat(pctEl.value);
  state.markup.pct = isNaN(v) || v < 0 ? 0 : Math.min(v, 200);
  renderResults(); renderQuote();
});

const dock = document.getElementById('dock');
document.getElementById('dockbar').addEventListener('click', () => {
  const open = dock.classList.toggle('open');
  document.getElementById('dockbar').setAttribute('aria-expanded', open);
});

document.getElementById('dockbody').addEventListener('click', e => {
  const q = e.target.closest('[data-q]');
  if (q){
    const item = state.quote.find(x => x.id === q.dataset.id);
    if (item){ item.qty = Math.max(1, item.qty + (q.dataset.q === '+' ? 1 : -1)); renderQuote(); }
    return;
  }
  const d = e.target.closest('[data-del]');
  if (d){ state.quote = state.quote.filter(x => x.id !== d.dataset.del); renderQuote(); return; }
  const dx = e.target.closest('[data-delx]');
  if (dx){
    const [list, id] = dx.dataset.delx.split(':');
    if (list === 'onsite') state.onsite = state.onsite.filter(x => x.id !== id);
    else if (list === 'incentive') state.incentives = state.incentives.filter(x => x.id !== id);
    else state.other = state.other.filter(x => x.id !== id);
    renderQuote(); return;
  }
  const tm = e.target.closest('[data-taxmode]');
  if (tm){
    const mode = tm.dataset.taxmode;
    if (mode !== state.taxMode){
      /* going from a calculated rate to a typed amount: carry the figure over so the total doesn't jump */
      if (mode === 'amt' && state.taxPct !== '' && (state.taxAmt === '' || state.taxAmt === undefined)){
        const carried = salesTax();
        if (carried > 0) state.taxAmt = carried;
      }
      state.taxMode = mode;
      renderQuote();
    }
    return;
  }
  const rs = e.target.closest('[data-qreset]');
  if (rs){
    const item = state.quote.find(x => x.id === rs.dataset.qreset);
    if (item && item.orig !== undefined){ item.unit = item.orig; delete item.orig; renderQuote(); }
    return;
  }
  const mt = e.target.closest('[data-mktoggle]');
  if (mt){
    const item = state.quote.find(x => x.id === mt.dataset.mktoggle);
    if (item){ item.mkOn = item.mkOn === false ? true : false; renderQuote(); }
    return;
  }
  if (e.target.closest('[data-add-custom]')){
    const dEl = document.getElementById('cudesc'), aEl = document.getElementById('cuamt');
    const desc = dEl.value.trim(), amt = parseFloat(aEl.value);
    if (!desc || isNaN(amt)){ toast('Enter a description and base price'); return; }
    state.quote.push({id:newId('cu'), key:null, loc:state.location, desc, section:'Custom item', code:'CUSTOM', model:state.model, unit:amt, qty:1, mkOn:true});
    toast('Custom option added');
    renderQuote(); return;
  }
  if (e.target.closest('[data-add-incentive]')){
    const dEl = document.getElementById('indesc'), aEl = document.getElementById('inamt');
    const desc = dEl.value.trim(), amt = Math.abs(parseFloat(aEl.value));
    if (!desc || isNaN(amt)){ toast('Enter a description and amount'); return; }
    state.incentives.push({id:newId('in'), desc, amount:amt});
    renderQuote(); return;
  }
  if (e.target.closest('[data-add-onsite]')){
    const dEl = document.getElementById('osdesc'), aEl = document.getElementById('osamt');
    const desc = dEl.value.trim(), amt = parseFloat(aEl.value);
    if (!desc || isNaN(amt)){ toast('Enter a description and amount'); return; }
    state.onsite.push({id:newId('os'), desc, amount:amt});
    renderQuote(); return;
  }
  if (e.target.closest('[data-add-other]')){
    const dEl = document.getElementById('otdesc'), aEl = document.getElementById('otamt');
    const desc = dEl.value.trim(), amt = parseFloat(aEl.value);
    if (!desc || isNaN(amt)){ toast('Enter a description and amount'); return; }
    state.other.push({id:newId('ot'), desc, amount:amt});
    renderQuote(); return;
  }
  if (e.target.id === 'qclear'){
    state.quote = []; state.onsite = []; state.other = []; state.incentives = [];
    state.improve = {foundation:'', excavation:'', electric:'', septic:'', water:'', decks:'', sidewalks:'', awnings:'', permits:''};
    state.improveTbd = {};
    state.taxAmt = ''; state.taxPct = '';
    renderQuote(); toast('Quote cleared'); return;
  }
  const ib = e.target.closest('[data-itemize]');
  if (ib){ state.itemize = ib.dataset.itemize === '1'; renderQuote(); return; }
  if (e.target.id === 'qprint'){ buildPrint(false); window.print(); return; }
  if (e.target.id === 'qprintint'){ buildPrint(true); window.print(); return; }
  if (e.target.id === 'qsave'){ saveQuoteFile(); return; }
  if (e.target.id === 'qload'){ document.getElementById('qfile').click(); return; }
});

document.getElementById('dockbody').addEventListener('change', e => {
  const tb = e.target.closest('[data-imptbd]');
  if (tb){ if (tb.checked) state.improveTbd[tb.dataset.imptbd] = true; else delete state.improveTbd[tb.dataset.imptbd]; renderQuote(); return; }
  const ob = e.target.closest('[data-othtbd]');
  if (ob){ const it = state.other.find(x => x.id === ob.dataset.othtbd); if (it){ if (ob.checked) it.tbd = true; else delete it.tbd; } renderQuote(); return; }
  const qp = e.target.closest('[data-qp]');
  if (qp){
    const item = state.quote.find(x => x.id === qp.dataset.qp);
    const v = parseFloat(qp.value);
    if (item && !isNaN(v)){
      if (item.code !== 'CUSTOM'){
        if (item.orig === undefined && v !== item.unit) item.orig = item.unit;
        if (item.orig !== undefined && v === item.orig) delete item.orig;
      }
      item.unit = v;
    }
    renderQuote(); return;
  }
  const xa = e.target.closest('[data-xamt]');
  if (xa){
    const [list, id] = xa.dataset.xamt.split(':');
    const item = (list === 'onsite' ? state.onsite : list === 'incentive' ? state.incentives : state.other).find(x => x.id === id);
    const v = parseFloat(xa.value);
    if (item && !isNaN(v)) item.amount = list === 'incentive' ? Math.abs(v) : v;
    renderQuote(); return;
  }
  const i = e.target.closest('[data-qi]');
  if (i){
    const item = state.quote.find(x => x.id === i.dataset.qi);
    if (item){ item.qty = Math.max(1, parseInt(i.value, 10) || 1); renderQuote(); }
    return;
  }
  const b = e.target.closest('[data-c="basePrice"]');
  if (b){ renderQuote(); return; }
  const im = e.target.closest('[data-imp]');
  if (im){ state.improve[im.dataset.imp] = im.value; renderQuote(); return; }
  if (e.target.id === 'taxamt'){ state.taxAmt = e.target.value; renderQuote(); return; }
  if (e.target.id === 'taxpct'){ state.taxPct = e.target.value; renderQuote(); return; }
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); qEl.focus(); qEl.select();
  }
  if (e.key === 'Escape' && document.activeElement === qEl){
    qEl.value = ''; state.q = '';
    document.getElementById('clear').classList.remove('on');
    renderRail(); renderResults();
  }
});

/* ---------- boot ---------- */
document.getElementById('homelist').innerHTML =
  (BOOKS.hermiston.homes || []).map(h => '<option value="' + esc(h.m) + '">' + esc(h.s) + '</option>').join('');

document.getElementById('loctabs').addEventListener('click', e => {
  const b = e.target.closest('[data-loc]'); if (!b) return;
  if (b.dataset.loc === state.location) return;
  setLocation(b.dataset.loc);
  toast((b.dataset.loc === 'albany' ? 'Albany' : 'Hermiston') + ' book selected');
});

document.getElementById('dockbody').addEventListener('input', e => {
  const f = e.target.closest('[data-c]');
  if (f) state.cust[f.dataset.c] = f.value;
});


document.getElementById('qfile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) loadQuoteFile(f);
  e.target.value = '';
});

syncMarkupUI(); setLocation(state.location); renderQuote();
})();
</script>
</body>
</html>
